name: ci

on:
  push:
    branches: [master]
  pull_request:
  # Manual backfill: rebuild and attach the binaries for an existing tag, for
  # when a binaries leg failed after the release was already cut. A re-run of
  # the failed job would reuse the workflow file from the original commit, so
  # a workflow fix can only reach an existing release through a new dispatch.
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to attach binaries to
        required: true
        type: string

permissions:
  contents: read

jobs:
  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: reviewdog/action-actionlint@50842263c20a7c46bd0065b9e624d3c569db061e # v1

  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
          - os: ubuntu-24.04-arm
          - os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install dependencies
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get update -q && sudo apt-get install -qy cmake pkg-config libpcre2-dev
          else
            brew install pcre2 pkgconf
          fi
      - name: Build
        run: |
          cmake -S . -B build
          cmake --build build
      - name: Fixture suite
        run: test/run.sh build/src/pplatex
      # The hint tables are data, and the way they break is one entry quietly
      # shadowing another as they grow. Nothing in the fixtures would notice.
      - name: Hint tables
        run: build/src/pplatex --self-test
      # The three entry points are one binary dispatching on argv[0]; a broken
      # install rule or symlink would pass every fixture and still ship a
      # ppluatex that does the wrong thing, so exercise the installed names.
      - name: Install and check engine dispatch
        run: |
          cmake --install build --prefix "$PWD/stage"
          for pair in pplatex:latex ppdflatex:pdflatex ppluatex:lualatex; do
            bin=${pair%%:*} engine=${pair##*:}
            out=$("./stage/bin/$bin" -v -- /nonexistent.tex 2>&1 || true)
            echo "$out" | grep -q "Executing: $engine" || { echo "::error::$bin did not select $engine"; exit 1; }
          done

  release-please:
    # A release PR is only opened or updated from a master where the tests are
    # green on all three platforms, so a red master cannot become a release.
    # Publishing runs in this same workflow run, gated on release_created: the
    # tag is pushed by the default GITHUB_TOKEN, which cannot trigger another
    # workflow, so an on:release workflow would never fire.
    needs: [test]
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        id: release
        with:
          config-file: .release-please-config.json
          manifest-file: .release-please-manifest.json

  binaries:
    needs: release-please
    # always() lets this run when release-please was skipped, which is the
    # workflow_dispatch backfill case; the second clause still gates the
    # ordinary path on a release actually having been created.
    if: always() && (needs.release-please.outputs.release_created == 'true' || (github.event_name == 'workflow_dispatch' && inputs.tag != ''))
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x86_64
          - os: ubuntu-24.04-arm
            target: linux-arm64
          - os: macos-latest
            target: macos-arm64
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      # Build the tag, not master: master can gain commits between the release
      # being cut and this job running, and the asset must match its tag.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name || inputs.tag }}
      - name: Install dependencies
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get update -q && sudo apt-get install -qy cmake pkg-config libpcre2-dev
          else
            brew install pcre2 pkgconf
          fi
      # Portable binaries link pcre2 from its static archives on both
      # platforms. pkg-config discovery is disabled by pointing PKG_CONFIG at
      # false, dropping CMake into the manual fallback that accepts explicit
      # library paths — pkg-config's IMPORTED_TARGET resolves the full .so
      # path, which "-static" cannot substitute ("attempted static link of
      # dynamic object" was the failure mode).
      #
      # Linux additionally links everything else statically, glibc included,
      # so the tarball runs on machines with nothing installed — a Raspberry
      # Pi being the motivating case; this is a small program with no dlopen
      # or NSS use, so static glibc is safe. macOS cannot link the system
      # statically, so its binary depends on libSystem/libc++ only.
      - name: Build a portable binary
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            A=$(find /usr/lib -name libpcre2-posix.a | head -1)
            B=$(find /usr/lib -name libpcre2-8.a | head -1)
            EXTRA=-DCMAKE_EXE_LINKER_FLAGS=-static
            INC=/usr/include
          else
            P=$(brew --prefix pcre2)
            A=$P/lib/libpcre2-posix.a
            B=$P/lib/libpcre2-8.a
            EXTRA=
            INC=$P/include
          fi
          test -f "$A" && test -f "$B"
          PKG_CONFIG=/usr/bin/false cmake -S . -B build -DCMAKE_BUILD_TYPE=Release $EXTRA \
            -DPCRE2_INCLUDE_DIR="$INC" \
            -DPCRE2_POSIX_LIBRARY="$A" \
            -DPCRE2_LIBRARY="$B"
          cmake --build build
      - name: Fixture suite against the release binary
        run: test/run.sh build/src/pplatex
      # tar preserves the ppdflatex/ppluatex symlinks, so the unpacked bin/
      # keeps the argv[0] engine dispatch without shipping three copies.
      - name: Package
        env:
          TAG: ${{ needs.release-please.outputs.tag_name || inputs.tag }}
          TARGET: ${{ matrix.target }}
        run: |
          cmake --install build --prefix stage
          tar -czf "pplatex-$TAG-$TARGET.tar.gz" -C stage bin
      # --clobber keeps a re-run of a single matrix leg from tripping over the
      # asset it already uploaded.
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release-please.outputs.tag_name || inputs.tag }}
          TARGET: ${{ matrix.target }}
        run: gh release upload --clobber "$TAG" "pplatex-$TAG-$TARGET.tar.gz"

  bump-tap:
    # Keep dpezto/homebrew-pplatex pointing at the latest release without a
    # manual bump. Gated on the binaries matrix, so the formula never
    # advertises a release whose build matrix failed. The push uses a
    # write-scoped deploy key (TAP_DEPLOY_KEY secret): GITHUB_TOKEN is scoped
    # to this repository and cannot push to the tap.
    needs: [release-please, binaries]
    if: always() && needs.binaries.result == 'success' && (needs.release-please.outputs.release_created == 'true' || (github.event_name == 'workflow_dispatch' && inputs.tag != ''))
    runs-on: ubuntu-latest
    steps:
      - name: Compute the source tarball checksum
        env:
          TAG: ${{ needs.release-please.outputs.tag_name || inputs.tag }}
        run: |
          curl -sfL "https://github.com/dpezto/pplatex/archive/refs/tags/$TAG.tar.gz" -o src.tar.gz
          echo "SHA=$(sha256sum src.tar.gz | cut -d' ' -f1)" >> "$GITHUB_ENV"
      - name: Update the formula in the tap
        env:
          TAG: ${{ needs.release-please.outputs.tag_name || inputs.tag }}
          DEPLOY_KEY: ${{ secrets.TAP_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/tap_key
          chmod 600 ~/.ssh/tap_key
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/tap_key -o StrictHostKeyChecking=accept-new"
          git clone --depth 1 git@github.com:dpezto/homebrew-pplatex.git tap
          cd tap
          sed -i -E "s|^(  url \").*(\")$|\1https://github.com/dpezto/pplatex/archive/refs/tags/$TAG.tar.gz\2|" Formula/pplatex.rb
          sed -i -E "s|^(  sha256 \").*(\")$|\1$SHA\2|" Formula/pplatex.rb
          if git diff --quiet; then
            echo "formula already current for $TAG"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "pplatex ${TAG#v}"
          git push
