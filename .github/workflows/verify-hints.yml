name: verify-hints

# Re-check the claims in src/symbols.inc against a real TeX Live.
#
# This runs on its own schedule rather than as part of CI because it needs a
# 4 GB distribution, and the ordinary build must never need one: the release
# binaries are fully static and src/symbols.inc is committed precisely so that
# building pplatex needs nothing but a compiler and PCRE2.
#
# A claim can rot without anything in this repository changing -- a package
# moves a command into the kernel, or drops it -- so the check is scheduled
# rather than only run on push.
#
# What is checked is that every committed claim still holds, not that the table
# matches what this distribution would produce. Those are different: the table
# is generated from whatever TeX Live the author had, and a fuller installation
# legitimately offers more commands than a smaller one. Demanding a byte match
# would fail for the wrong reason and teach everyone to ignore the job.

on:
  schedule:
    # Mondays, 05:00 UTC.
    - cron: '0 5 * * 1'
  pull_request:
    paths:
      - 'tools/**'
      - 'src/symbols.inc'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    container: texlive/texlive:latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # Read the committed table back out as claims, so what gets checked is
      # exactly what ships rather than whatever a fresh scrape turns up.
      - name: Recover the committed claims
        run: |
          sed -n 's/^    { "\(\\\\[^"]*\)", [0-9]*  *},  \/\* \(.*\) \*\/$/\1\t\2/p' \
              src/symbols.inc | sed 's/\\\\/\\/g' > committed.tsv
          count=$(wc -l < committed.tsv | tr -d ' ')
          echo "recovered $count claims from src/symbols.inc"
          if [ "$count" -lt 100 ]; then
            echo "That is far too few; the parser above no longer matches the file."
            exit 1
          fi

      - name: Every committed claim must still hold
        run: tools/verify-hints.sh committed.tsv

      # Informational only. A fuller distribution than the one the table was
      # built from will define commands it does not list, which is worth
      # knowing about but is not a failure.
      - name: Report commands this distribution could add
        continue-on-error: true
        run: |
          tools/mine-cs.sh > cs-index.tsv
          cut -f1 committed.tsv | sort -u > have.txt
          cut -f1 cs-index.tsv  | sort -u > seen.txt
          comm -13 have.txt seen.txt > extra.txt
          echo "$(wc -l < extra.txt | tr -d ' ') commands are available here but not in the table:"
          head -40 extra.txt
